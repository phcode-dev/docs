<svg xmlns="http://www.w3.org/2000/svg" width="880" height="408" viewBox="0 0 880 408" role="img" aria-labelledby="title desc">
  <title id="title">The same 2400 pixels at two printed widths</title>
  <desc id="desc">At 8 inches wide, 2400 pixels provide 300 pixels per inch. At 12 inches wide, the same 2400 pixels provide 200 pixels per inch. The second line is one and a half times as wide; no pixels are added.</desc>
  <rect width="880" height="408" fill="#fffaf4"/>
  <g font-family="Arial, sans-serif" fill="#242526">
    <text x="48" y="58" font-size="34" font-weight="700">Same pixels, different print sizes</text>
    <text x="48" y="125" font-size="30">8 inches wide</text>
    <text x="505" y="125" font-size="30" font-weight="700">300 PPI</text>
    <path d="M48 151v26m0-13h456m0-13v26" stroke="#b85600" stroke-width="4"/>
    <text x="48" y="211" font-size="28">2400 pixels ÷ 8 inches</text>
    <text x="48" y="279" font-size="30">12 inches wide</text>
    <text x="685" y="279" font-size="30" font-weight="700">200 PPI</text>
    <path d="M48 305v26m0-13h684m0-13v26" stroke="#b85600" stroke-width="4"/>
    <text x="48" y="365" font-size="28">2400 pixels ÷ 12 inches</text>
  </g>
</svg>
