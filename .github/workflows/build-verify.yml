name: Test docs build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    name: Test docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Test tutorial release tooling
        run: npm run test:tutorials
      - name: Test link verification
        run: npm run test:links
      - name: Package tutorial projects
        run: npm run package:tutorials
      - name: Build website
        run: npm run build
      - name: Verify tutorial release files
        run: npm run verify:tutorials
